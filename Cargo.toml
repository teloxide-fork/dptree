[package]
name = "dptree-fork"
version = "0.6.0"
authors = ["p0lunin <dmytro.polunin@gmail.com>", "hirrolot <hirrolot@gmail.com>"]
edition = "2018"
description = "An asynchronous event dispatch mechanism for Rust"
repository = "https://github.com/teloxide-fork/dptree"
homepage = "https://github.com/teloxide-fork/dptree"
documentation = "https://docs.rs/dptree-fork/"
readme = "README.md"
categories = ["asynchronous", "rust-patterns"]
license = "MIT"

[lib]
name = "dptree"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
futures = { version = "0.3", default-features = false, features = ["alloc"] }
colored = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync"] }
maplit = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "-Znormalize-docs"]
rustc-args = ["--cfg", "dep_docsrs"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[package.metadata.release]
tag-name = "v{{version}}"

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
search = "## unreleased"
replace = "## unreleased\n\n## {{version}} - {{date}}"
exactly = 1

[[package.metadata.release.pre-release-replacements]]
file = "README.md"
search = 'package = "dptree-fork", version = "[^"]+"'
replace = 'package = "dptree-fork", version = "{{version}}"'
exactly = 1
